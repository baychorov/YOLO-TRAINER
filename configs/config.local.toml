# ==========================================
# YOLO Trainer Configuration - Local Profile
# ==========================================

[dataset]
yaml_path = "configs/data.yaml"

[model]
base_weights = "yolo11n.pt"
task = "detect"

[training]
epochs = 1
batch_size = 16
imgsz = 640
device = "0"  # or "cpu"
workers = 8

[logger]
filepath = "logs/training.log"
rotation = "10 MB"
retention = 5
file_log_level = "DEBUG"
notifier_log_level = "ERROR"
is_notifier_active = false

[notifier]
# Email server configurations (Credentials are read from .env)
receiver_email = "your_email@example.com"
smtp_server = "smtp.gmail.com"
port = 587
subject_prefix = "[YOLO-Pipeline] Training Alert"
